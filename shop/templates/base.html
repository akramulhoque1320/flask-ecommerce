<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ShopEase{% endblock %} · ShopEase</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('shop.index') }}" class="brand">🛍️ ShopEase</a>
    <form action="{{ url_for('shop.index') }}" class="search">
      <input type="search" name="q" placeholder="Search products…" value="{{ q or '' }}" aria-label="Search products" />
    </form>
    <a href="{{ url_for('shop.cart') }}" class="cart-link">🛒 Cart <span class="badge">{{ cart_count }}</span></a>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">ShopEase · a Flask demo shop by Akramul Hoque (Ahnaf)</footer>
</body>
</html>
